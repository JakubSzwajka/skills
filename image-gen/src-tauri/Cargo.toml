[package]
name = "image-gen"
version = "0.1.0"
description = "Fast, private desktop app for generating and browsing images through existing consumer subscriptions"
edition = "2021"

[lib]
name = "image_gen"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "sync", "time", "io-util"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
image = "0.25"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
libc = "0.2"
arboard = "3"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
strip = true
